<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      margin: 0; padding: 20px 14px; 
      background: #0f172a; color: white; text-align: center; 
    }
    h2 { margin: 8px 0 16px; font-size: 24px; color: #38bdf8; }
    #reader-wrapper {
      width: 100%; max-width: 360px; margin: 0 auto; 
      border-radius: 12px; overflow: hidden; 
      border: 2px solid #38bdf8; background: #000;
    }
    #reader { width: 100%; }
    #status { margin: 18px 0; font-size: 19px; font-weight: bold; color: #e2e8f0; }
    #last-scan { 
      margin: 15px auto; padding: 16px; border-radius: 10px; 
      background: #1e293b; max-width: 360px; font-size: 18px; 
      border: 1px solid #475569; display: none; 
    }
  </style>
</head>
<body>

  <h2>📱 Wireless Book Scanner</h2>

  <div id="reader-wrapper">
    <div id="reader"></div>
  </div>

  <div id="status">Point camera at book barcode...</div>

  <div id="last-scan">
    ✅ Sent to Laptop: <br><strong id="scan-number" style="color: #4ade80; font-size: 22px;">-</strong>
  </div>

  <script>
    // --- PASTE YOUR SUPABASE DETAILS HERE ---
    const SUPABASE_URL = "https://csuvgixjynuehrpiqniu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_MZiDRUbD-0LjxpBWZAQsww_BsXnTDmC";
    const SHOP_ID = "Boy Scout Hut";

    let html5QrCode = null;
    let isProcessing = false;

    function startLiveScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 15, qrbox: { width: 280, height: 150 }, aspectRatio: 1.0 },
        onScanSuccess
      ).catch(err => {
        document.getElementById("status").innerHTML = 
          "<span style='color:#ef4444;'>Please allow camera permissions!</span>";
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true; // Prevent duplicate rapid scans

      // Vibrate phone on successful scan!
      if (navigator.vibrate) navigator.vibrate(100);

      document.getElementById("status").innerText = "Beaming to Laptop...";
      document.getElementById("scan-number").innerText = decodedText;
      document.getElementById("last-scan").style.display = "block";

      // POST directly to Supabase scan_queue table
      fetch(SUPABASE_URL + "/rest/v1/scan_queue", {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify({ shop_id: SHOP_ID, isbn: decodedText })
      })
      .then(() => {
        document.getElementById("status").innerText = "Ready for next book!";
        setTimeout(() => { isProcessing = false; }, 1200); // Ready for next book in 1.2s
      })
      .catch(err => {
        document.getElementById("status").innerText = "Error sending to cloud. Retrying...";
        isProcessing = false;
      });
    }

    window.onload = startLiveScanner;
  </script>
</body>
</html>
